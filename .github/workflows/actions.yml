on:
  workflow_dispatch:

jobs:
  job1:
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node_version: [14.x, 15.x, 16.x]
    
    # These must be indented to be part of job1
    runs-on: ${{ matrix.os }}
    steps:  
      - uses: actions/checkout@v3 # Good practice to include checkout first
      - uses: actions/setup-node@v3
        with: 
          node-version: ${{ matrix.node_version }}